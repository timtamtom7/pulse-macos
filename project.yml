name: Pulse
options:
  bundleIdPrefix: com.pulse
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
    PRODUCT_NAME: Pulse
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_FILE: Resources/Info.plist
    CODE_SIGN_ENTITLEMENTS: Resources/Pulse.entitlements
    ENABLE_HARDENED_RUNTIME: YES

packages:
  SQLite:
    url: https://github.com/stephencelis/SQLite.swift
    from: "0.14.1"

targets:
  PulseShared:
    type: framework
    platform: macOS
    sources:
      - Sources/PulseShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pulse.shared
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        CODE_SIGN_IDENTITY: "-"

  Pulse:
    type: application
    platform: macOS
    sources:
      - Sources
      - Resources
    dependencies:
      - package: SQLite
        product: SQLite
      - target: PulseShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pulse.app
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES

  PulseWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - PulseWidget
    dependencies:
      - target: PulseShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pulse.app.widget
        PRODUCT_NAME: PulseWidget
        PRODUCT_MODULE_NAME: PulseWidget
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: PulseWidget/PulseWidget.entitlements

  PulseTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/PulseTests
    dependencies:
      - target: Pulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pulse.app.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Pulse.app/Contents/MacOS/Pulse"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Pulse:
    build:
      targets:
        Pulse: all
        PulseShared: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  PulseWidgetExtension:
    build:
      targets:
        PulseWidgetExtension: all
        PulseShared: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  PulseTests:
    build:
      targets:
        PulseTests: all
        Pulse: all
        PulseShared: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
